<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeadCanon viewer</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232563eb'/%3E%3Ctext x='8' y='11.5' font-size='9' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EHC%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">HC</span>
      <div>
        <div class="title">HeadCanon viewer</div>
        <div class="sub" id="canon-path">loading…</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/adopt" data-view="adopt" title="Review the drafted canon on a canvas with the session">Adopt</a>
      <a href="#/" data-view="overview">Overview</a>
      <a href="#/tree" data-view="tree">Tree</a>
      <a href="#/health" data-view="health">Health</a>
      <a href="#/attention" data-view="attention">Attention <span class="pill" id="attention-count" hidden></span></a>
      <a href="#/journeys" data-view="journeys">Journeys</a>
      <a href="#/mocks" data-view="mocks" title="Pages of what a person will see, each part bound to its requirements">Mocks</a>
      <a href="#/decisions" data-view="decisions">Decisions</a>
      <a href="#/glossary" data-view="glossary">Glossary</a>
    </nav>
    <div class="actions">
      <span class="sub" id="generated"></span>
      <button id="refresh" class="btn" title="Re-read the canon from disk">Refresh</button>
    </div>
  </header>
  <main id="main"><p class="muted">Loading the canon…</p></main>
  <aside id="session" class="session collapsed" aria-live="polite">
    <div class="session-head">
      <span class="session-title">Session</span>
      <span class="pill" id="session-pending" hidden></span>
      <span class="sub" id="session-status">no question waiting</span>
      <button class="btn small" id="session-toggle" title="Open the session panel">Open</button>
    </div>
    <div class="session-body">
      <div id="question"><p class="muted">When the session asks something, it appears here. Edits you make in the tree, messages you send and branches you ask for reach the session too.</p></div>
      <div id="quote" class="quote-chip" hidden></div>
      <div class="session-msg"><textarea id="msg" rows="2" placeholder="Message the session…"></textarea><button class="btn" id="msg-send">Send</button></div>
      <ul id="activity" class="chat"></ul>
    </div>
  </aside>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="popup" class="popup" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js" defer></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
