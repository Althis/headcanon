<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="system-ui, sans-serif" font-size="14">
  <style>.box{fill:#fff;stroke:#555;stroke-width:1.5}.ghost{fill:#f3f3f3;stroke:#999;stroke-dasharray:4 3}.btn{fill:#e8e8e8;stroke:#555}.primary{fill:#cfe0ff;stroke:#2563eb}.label{fill:#222}.muted{fill:#777;font-size:12px}.tag{fill:#fff;stroke:#777}.grip{fill:none;stroke:#999}</style>
  <g id="card"><rect class="box" x="20" y="20" width="480" height="300" rx="10"/></g>
  <g id="head">
    <rect class="tag" x="36" y="34" width="62" height="20" rx="4"/><text class="muted" x="43" y="48" font-family="ui-monospace, monospace">REQ-1.2</text>
    <rect class="ghost" x="106" y="34" width="60" height="20" rx="10"/><text class="muted" x="116" y="48">assumed</text>
    <circle cx="186" cy="44" r="5" fill="#f59e0b"/><text class="muted" x="196" y="48">the session's guess from your documents</text>
  </g>
  <g id="close"><rect class="btn" x="462" y="32" width="24" height="24" rx="6"/><text class="label" x="469" y="49">✕</text></g>
  <g id="title"><text class="label" x="36" y="84" font-size="20" font-weight="700">Title of the node</text></g>
  <g id="body">
    <rect class="ghost" x="36" y="100" width="448" height="130" rx="6"/>
    <text class="muted" x="46" y="124">The node's text: what the thing is, one or two sentences,</text>
    <text class="muted" x="46" y="144">read as an encyclopedia entry.</text>
    <rect x="46" y="156" width="150" height="16" fill="#cfe0ff"/><text class="label" x="48" y="168" font-size="12">selected words</text>
    <rect class="btn" x="200" y="150" width="24" height="24" rx="12"/><text class="label" x="208" y="167" font-weight="700">?</text>
  </g>
  <g id="approve"><rect class="primary" x="36" y="252" width="90" height="32" rx="6"/><text class="label" x="56" y="273">Approve</text></g>
  <g id="rewrite"><rect class="btn" x="134" y="252" width="86" height="32" rx="6"/><text class="label" x="154" y="273">Rewrite</text></g>
  <g id="delete"><rect class="btn" x="228" y="252" width="78" height="32" rx="6"/><text class="label" x="248" y="273">Delete</text></g>
  <g id="define"><rect class="btn" x="314" y="252" width="124" height="32" rx="6"/><text class="label" x="330" y="273">Define further</text></g>
  <g id="grips">
    <path class="grip" d="M22 34 L34 22 M22 40 L40 22"/><path class="grip" d="M486 22 L498 34 M480 22 L498 40"/>
    <path class="grip" d="M22 306 L34 318 M22 300 L40 318"/><path class="grip" d="M486 318 L498 306 M480 318 L498 300"/>
  </g>
</svg>
